services:
  # 1. Serviciul tau principal de Chat (Persoana A - Port 8000)
  llm-chat-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: llm-chat-service
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - RERANKER_URL=http://reranker-service:8002/api/rerank/chunks
      - EMBEDDER_URL=http://embedder-service:8001/api/query/embed
      - QDRANT_HOST=qdrant-vector-db
      - QDRANT_PORT=6333
    networks:
      - rag_network
    restart: unless-stopped

  # 2. Baza de Date Vectoriala Qdrant (Port 6333)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vector-db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - rag_network
    restart: unless-stopped

volumes:
  qdrant_storage:

networks:
  rag_network:
    driver: bridge

